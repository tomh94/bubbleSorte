<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bubble sort</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js"></script>
</head>
<body>

<label>
    <input type="text" id="input" placeholder="535,3243,4,34,3"/>
</label>
<button id="load" onclick="handleLoadClick()">Načíst pole</button>

<div id="grid" class="grid"></div>

<p id="status"></p>

<div class="controls">
    <button id="step" onclick="step()">Krok</button>
    <button id="run" onclick="handleRunClick()">Spustit celé</button>
    <button id="reset" onclick="handleResetClick()">Reset</button>
</div>

</body>

</html>
